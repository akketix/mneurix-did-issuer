name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build + test + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
  audit:
    name: Dependency audit (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
  trivy:
    name: Trivy secret + config scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Secret scan. Report-only until the test-fixture false positives (e.g. the
      # committed test Ed25519 key in packages/licensing/test) are triaged + an
      # ignore list is added -- then drop continue-on-error to hard-fail. The
      # pre-public local history sweep found no real secrets.
      - name: Trivy - repo secret scan (report-only until baselined)
        uses: aquasecurity/trivy-action@v0.24.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Report-only until the Dockerfile/compose findings are baselined.
      - name: Trivy - Dockerfile + compose config scan (report-only)
        uses: aquasecurity/trivy-action@v0.24.0
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
